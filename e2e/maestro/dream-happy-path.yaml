appId: host.exp.Exponent
---
- launchApp
- tapOn:
    id: "mock-sign-in"
- tapOn:
    id: "go-dream-capture"
- tapOn:
    id: "dream-text"
- inputText: "I was walking through a quiet station while holding a blue notebook."
