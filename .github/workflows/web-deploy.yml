name: web-deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: AWS environment to deploy.
        required: true
        default: dev
        type: choice
        options:
          - dev
          - qa
          - prod
  push:
    branches:
      - main
    paths:
      - app/**
      - .github/workflows/web-deploy.yml

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  WEB_BUCKET: ${{ vars.WEB_BUCKET }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
  EXPO_PUBLIC_API_BASE_URL: ${{ vars.API_BASE_URL }}
  EXPO_PUBLIC_MOCK_API: ${{ vars.MOCK_API || 'false' }}
  EXPO_PUBLIC_COGNITO_DOMAIN: ${{ vars.COGNITO_DOMAIN }}
  EXPO_PUBLIC_COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}

jobs:
  test-build-deploy:
    name: test build deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Test app
        working-directory: app
        run: npm test

      - name: Typecheck app
        working-directory: app
        run: npm run typecheck

      - name: Build Expo web
        working-directory: app
        run: npm run build:web

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}

      - name: Upload web build
        run: aws s3 sync app/dist "s3://$WEB_BUCKET" --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
