name: api-deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: AWS environment to deploy.
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      image_tag:
        description: Optional image tag. Defaults to the commit SHA.
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - api/**
      - personas/**
      - .github/workflows/api-deploy.yml

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.API_ECR_REPOSITORY }}
  ECS_CLUSTER: ${{ vars.API_ECS_CLUSTER }}
  ECS_SERVICE: ${{ vars.API_ECS_SERVICE }}

jobs:
  build-test-push-deploy:
    name: build test push deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Test API
        shell: pwsh
        run: dotnet test api/DreamLens.sln --configuration Release

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve image tag
        id: image
        shell: bash
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_SHA}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "uri=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:$TAG" >> "$GITHUB_OUTPUT"
          echo "latest_uri=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: api
          file: api/src/DreamLens.Api/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.uri }}
            ${{ steps.image.outputs.latest_uri }}

      - name: Force ECS service deployment
        run: aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --force-new-deployment
