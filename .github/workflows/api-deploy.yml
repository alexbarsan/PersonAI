name: api-deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: AWS environment to deploy.
        required: true
        default: dev
        type: choice
        options:
          - dev
          - qa
          - prod
      image_tag:
        description: Optional image tag. Defaults to the commit SHA.
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - api/**
      - personas/**
      - .github/workflows/api-deploy.yml

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.API_ECR_REPOSITORY }}
  ECS_CLUSTER: ${{ vars.API_ECS_CLUSTER }}
  ECS_SERVICE: ${{ vars.API_ECS_SERVICE }}
  ECS_WORKER_SERVICE: ${{ vars.API_ECS_WORKER_SERVICE }}

jobs:
  build-test-push-deploy:
    name: build test push deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Test API
        shell: pwsh
        run: dotnet test api/DreamLens.sln --configuration Release

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve image tag
        id: image
        shell: bash
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_SHA}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "uri=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:$TAG" >> "$GITHUB_OUTPUT"
          echo "latest_uri=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/src/DreamLens.Api/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.uri }}
            ${{ steps.image.outputs.latest_uri }}

      - name: Download current ECS task definition
        run: aws ecs describe-task-definition --task-definition "$ECS_SERVICE" --query taskDefinition > task-definition.json

      - name: Render ECS task definition
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: api
          image: ${{ steps.image.outputs.uri }}

      - name: Deploy ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: false

      - name: Wait for ECS service stability
        run: aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

      - name: Discover worker service
        id: worker
        shell: bash
        run: |
          SERVICE="${ECS_WORKER_SERVICE:-${ECS_SERVICE%-api}-worker}"
          ACTIVE=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$SERVICE" --query 'length(services[?status==`ACTIVE`])' --output text)
          echo "service=$SERVICE" >> "$GITHUB_OUTPUT"
          echo "exists=$([ "$ACTIVE" = "1" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Download current worker task definition
        if: steps.worker.outputs.exists == 'true'
        run: aws ecs describe-task-definition --task-definition "${{ steps.worker.outputs.service }}" --query taskDefinition > worker-task-definition.json

      - name: Render worker task definition
        if: steps.worker.outputs.exists == 'true'
        id: render-worker-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: worker-task-definition.json
          container-name: worker
          image: ${{ steps.image.outputs.uri }}

      - name: Deploy worker task definition
        if: steps.worker.outputs.exists == 'true'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-worker-task-definition.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ steps.worker.outputs.service }}
          wait-for-service-stability: false

      - name: Wait for worker service stability
        if: steps.worker.outputs.exists == 'true'
        run: aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "${{ steps.worker.outputs.service }}"
