name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  foundation:
    name: foundation
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check S0 structure
        shell: pwsh
        run: ./scripts/check-s0-structure.ps1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Test API
        shell: pwsh
        run: dotnet test api/DreamLens.sln --configuration Release
