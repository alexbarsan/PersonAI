name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  foundation:
    name: foundation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check S0 structure
        shell: pwsh
        run: ./scripts/check-s0-structure.ps1

      - name: Check S17 infrastructure structure
        shell: pwsh
        run: ./scripts/check-s17-infra.ps1

      - name: Check S18 workflow structure
        shell: pwsh
        run: ./scripts/check-s18-workflows.ps1

      - name: Check S19 observability structure
        shell: pwsh
        run: ./scripts/check-s19-observability.ps1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Test API
        shell: pwsh
        run: dotnet test api/DreamLens.sln --configuration Release

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Test app
        working-directory: app
        run: npm test

      - name: Typecheck app
        working-directory: app
        run: npm run typecheck

      - name: Install Playwright browsers
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Playwright web E2E
        working-directory: app
        run: npm run e2e:web
